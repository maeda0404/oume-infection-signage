<!doctype html>

<html lang="ja">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>西多摩地域 感染症流行状況</title>

    <link
        rel="stylesheet"
        href="css/style.css?v=9"
    >

    <script
        src="js/app.js?v=3"
        defer
    ></script>
</head>


<body>

    <!-- =====================================================
         画面全体の表示領域
         ===================================================== -->
    <div class="viewport">


        <!-- =================================================
             1920 × 1080 基準キャンバス
             ================================================= -->
        <div class="screen">


            <!-- =============================================
                 ヘッダー
                 ============================================= -->
            <header>
                <h1>
                    西多摩地域　感染症流行状況
                </h1>
            </header>


            <!-- =============================================
                 メイン
                 ============================================= -->
            <main>


                <!-- =========================================
                     左側 啓発画像
                     ========================================= -->
                <section class="measures">

                    <img
                        src="assets/handwash.png"
                        alt="手洗い"
                    >

                    <img
                        src="assets/ventilation.png"
                        alt="換気"
                    >

                </section>


                <!-- =========================================
                     中央ステータス
                     ========================================= -->
                <section
                    class="status"
                    aria-live="polite"
                >


                    <!-- =====================================
                         疾患カード
                         ===================================== -->
                    <div class="disease-grid">


                        <!-- =================================
                             インフルエンザ
                             ================================= -->
                        <article
                            id="influenzaCard"
                            class="disease-card"
                        >

                            <h2>
                                インフルエンザ
                            </h2>


                            <div
                                id="influenzaLevel"
                                class="level-badge"
                            >
                                確認中
                            </div>


                            <div class="value">

                                <strong id="influenzaValue">
                                    --
                                </strong>

                                <span>
                                    人
                                </span>

                            </div>


                            <div class="caption">
                                定点当たり報告数
                            </div>


                            <div
                                id="influenzaTrend"
                                class="trend"
                            >
                                前週 --
                            </div>


                            <div
                                id="influenzaWeek"
                                class="week"
                            >
                                --
                            </div>


                            <div class="tokyo-row">

                                東京都　

                                <strong id="influenzaTokyo">
                                    --
                                </strong>

                                人／定点

                            </div>

                        </article>



                        <!-- =================================
                             新型コロナ
                             ================================= -->
                        <article
                            id="covid19Card"
                            class="disease-card"
                        >

                            <h2>
                                新型コロナ
                            </h2>


                            <div
                                id="covid19Level"
                                class="level-badge"
                            >
                                確認中
                            </div>


                            <div class="value">

                                <strong id="covid19Value">
                                    --
                                </strong>

                                <span>
                                    人
                                </span>

                            </div>


                            <div class="caption">
                                定点当たり報告数
                            </div>


                            <div
                                id="covid19Trend"
                                class="trend"
                            >
                                前週 --
                            </div>


                            <div
                                id="covid19Week"
                                class="week"
                            >
                                --
                            </div>


                            <div class="tokyo-row">

                                東京都　

                                <strong id="covid19Tokyo">
                                    --
                                </strong>

                                人／定点

                            </div>

                        </article>

                    </div>


                    <!-- =====================================
                         データ更新状態
                         ===================================== -->
                    <div class="data-state">

                        定点当たり報告数 ｜

                        <span id="dataStatus">
                            確認中
                        </span>

                    </div>


                    <!-- =====================================
                         出典
                         ===================================== -->
                    <div class="source">
                        出典：東京都西多摩保健所・東京都感染症情報センター
                    </div>


                </section>


                <!-- =========================================
                     右側 啓発画像
                     ========================================= -->
                <section class="measures">

                    <img
                        src="assets/healthcheck.png"
                        alt="体調報告"
                    >

                    <img
                        src="assets/mask.png"
                        alt="正しいマスク着用"
                    >

                </section>


            </main>


            <!-- =============================================
                 フッター
                 ============================================= -->
            <footer>
                体調に変化がある場合は、無理をせず報告してください
            </footer>


        </div>

    </div>


    <!-- =====================================================
         1920 × 1080 のレイアウトを
         画面サイズに合わせて等倍縮小
         ===================================================== -->
    <script>

        function fitScreen() {

            const screen = document.querySelector('.screen');

            const baseWidth = 1920;
            const baseHeight = 1080;

            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;

            /*
             * 横方向の倍率
             * 縦方向の倍率
             * 小さい方を採用することで、
             * 1920 × 1080 の比率を崩さず画面内に収める
             */
            const scaleX = viewportWidth / baseWidth;
            const scaleY = viewportHeight / baseHeight;

            const scale = Math.min(
                scaleX,
                scaleY
            );

            screen.style.transform =
                `scale(${scale})`;
        }


        /*
         * 初回表示
         */
        window.addEventListener(
            'DOMContentLoaded',
            fitScreen
        );


        /*
         * ブラウザサイズ変更時
         */
        window.addEventListener(
            'resize',
            fitScreen
        );

    </script>


</body>

</html>
