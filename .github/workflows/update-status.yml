name: Update infection status

on:
  workflow_dispatch:

  schedule:
    # JST 08:15
    - cron: "15 23 * * *"

    # JST 12:15
    - cron: "15 3 * * *"

    # JST 17:15
    - cron: "15 8 * * *"

permissions:
  contents: write

# 同じ更新処理が重ならないようにする
concurrency:
  group: update-infection-status
  cancel-in-progress: false

jobs:
  update-status:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pypdf

      - name: Run infection data update
        run: |
          python scripts/update_status.py

      - name: Show generated status.json
        run: |
          cat data/status.json

      - name: Commit updated status.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/status.json

          if git diff --cached --quiet; then
            echo "No changes to status.json"
            exit 0
          fi

          git commit -m "Update infection status"

          # Action実行中にmainが更新されていても取り込む
          git pull --rebase origin main

          # push競合時は最新状態を取り込んで再試行
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "status.json pushed successfully"
              exit 0
            fi

            echo "Push failed: retry ${attempt}/3"
            git pull --rebase origin main
            sleep 5
          done

          echo "Failed to push status.json after 3 attempts"
          exit 1
