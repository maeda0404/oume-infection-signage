name: Update infection status

on:
  workflow_dispatch:

  schedule:
    # JST 08:15
    - cron: "15 23 * * *"

    # JST 12:15
    - cron: "15 3 * * *"

    # JST 17:15
    - cron: "15 8 * * *"

permissions:
  contents: write

jobs:
  update-status:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pypdf

      - name: Run infection data update
        run: |
          python scripts/update_status.py

      - name: Show generated status.json
        run: |
          cat data/status.json

      - name: Commit updated status.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/status.json

          if git diff --cached --quiet; then
            echo "No changes to status.json"
            exit 0
          fi

          git commit -m "Update infection status"
          git push
